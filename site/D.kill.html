<!-- 31 d.search -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<base target="_blank">
<title>D.kill</title>
<style>
html, body {
  height: 100%;
  margin: 0;
  background: #000000;
  color: #33ff33;
}
body {
  font-family: Consolas, "Courier New", monospace;
  font-size: 20px;
  line-height: 1.5;
  text-shadow: 0 0 6px rgba(51, 255, 51, 0.45);
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    rgba(0, 0, 0, 0.18) 0 1px,
    transparent 1px 3px
  );
}
#screen {
  position: relative;
  box-sizing: border-box;
  height: 100%;
  overflow: auto;
  padding: 28px 32px;
}
#log p, #screen > p {
  margin: 0 0 8px;
}
a {
  color: #33ff33;
}
.row {
  display: flex;
  align-items: center;
}
.prompt {
  white-space: pre;
}
.type {
  position: relative;
  flex: 1;
  min-height: 1.5em;
}
#typed {
  white-space: pre;
}
.cursor {
  display: inline-block;
  animation: blink 1s steps(1) infinite;
}
@keyframes blink {
  50% { opacity: 0; }
}
input {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  border: 0;
  padding: 0;
  background: transparent;
  color: transparent;
  caret-color: transparent;
  font: inherit;
  outline: none;
}
</style>
</head>
<body>
<div id="screen">
<p>擊殺.擊殺擊殺擊殺擊殺擊殺擊殺</p>
<div id="log"></div>
<form id="line" action="result.html" method="get" target="_blank">
<input type="hidden" name="db" value="d">
<div class="row">
<span class="prompt">&gt; </span>
<span class="type">
<span id="typed"></span><span class="cursor">_</span>
<input type="text" id="q" name="q" autocomplete="off" spellcheck="false" autofocus>
</span>
</div>
</form>
</div>
<script src="d-search-db.js?v=7"></script>
<script>
var storeKey = "D.kill";
var log = [];

function esc(text) {
  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function loadLog() {
  try {
    var saved = JSON.parse(localStorage.getItem(storeKey));
    if (saved && saved.length) log = saved;
  } catch (e) {}
}

function saveLog() {
  localStorage.setItem(storeKey, JSON.stringify(log));
}

function findHits(q) {
  var found = [];
  var i, n;
  if (typeof dSearchDb === "undefined") return found;
  for (i = 0; i < dSearchDb.length; i++) {
    var keys = dSearchDb[i].keys;
    for (n = 0; n < keys.length; n++) {
      if (keys[n] === q) {
        found.push(dSearchDb[i]);
        break;
      }
    }
  }
  return found;
}

function render() {
  var html = "";
  var i, n, hits;
  for (i = 0; i < log.length; i++) {
    html += "<p>&gt; " + esc(log[i].q) + "</p>";
    hits = log[i].hits;
    if (!hits.length) {
      html += "<p>擊殺擊殺擊殺擊殺擊殺</p>";
    } else {
      html += "<p>擊殺擊殺擊殺 ";
      for (n = 0; n < hits.length; n++) {
        html += "<a href=\"" + esc(hits[n].page) + "\" target=\"_blank\">" + esc(hits[n].title) + "</a>";
      }
      html += "</p>";
    }
  }
  document.getElementById("log").innerHTML = html;
  var screen = document.getElementById("screen");
  screen.scrollTop = screen.scrollHeight;
}

function ask(raw) {
  var q = String(raw).replace(/\s/g, "");
  if (!q) return;
  if (q === "擊殺") {
    location.assign("endingHD.html");
    return;
  }
  var hits = findHits(q);
  var kept = [];
  var i;
  for (i = 0; i < hits.length; i++) {
    kept.push({ title: hits[i].title, page: hits[i].page });
  }
  log.push({ q: q, hits: kept });
  saveLog();
  render();
}

var qInput = document.getElementById("q");

function showTyped() {
  document.getElementById("typed").textContent = qInput.value;
}

qInput.addEventListener("input", showTyped);

document.getElementById("line").onsubmit = function () {
  ask(qInput.value);
  qInput.value = "";
  showTyped();
  return false;
};

document.getElementById("screen").onclick = function (event) {
  if (event.target.tagName === "A" || event.target.tagName === "INPUT") return;
  qInput.focus();
};

loadLog();
render();

document.addEventListener("click", function (e) {
  var el = e.target;
  var text;
  if (!el || el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.tagName === "A") return;
  text = el.textContent || "";
  if (text.indexOf("擊殺") === -1) return;
  if (/[A-Za-z0-9\u4e00-\u9fff]/.test(text.replace(/擊殺/g, ""))) return;
  location.assign("endingHD.html");
});
</script>
<script src="kill-marks.js"></script>
</body>
</html>
