<!-- 31 d.search -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<base target="_blank">
<title>D.kill</title>
<style>
html, body {
  height: 100%;
  margin: 0;
  background: #000000;
  color: #33ff33;
}
body {
  font-family: Consolas, "Courier New", monospace;
  font-size: 20px;
  line-height: 1.5;
  text-shadow: 0 0 6px rgba(51, 255, 51, 0.45);
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    rgba(0, 0, 0, 0.18) 0 1px,
    transparent 1px 3px
  );
}
#screen {
  position: relative;
  box-sizing: border-box;
  height: 100%;
  overflow: auto;
  padding: 28px 32px;
}
#log p, #screen > p {
  margin: 0 0 8px;
}
a {
  color: #33ff33;
}
.row {
  display: flex;
  align-items: center;
}
.prompt {
  white-space: pre;
}
.type {
  position: relative;
  flex: 1;
  min-height: 1.5em;
}
#typed {
  white-space: pre;
}
.cursor {
  display: inline-block;
  animation: blink 1s steps(1) infinite;
}
@keyframes blink {
  50% { opacity: 0; }
}
input {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  border: 0;
  padding: 0;
  background: transparent;
  color: transparent;
  caret-color: transparent;
  font: inherit;
  outline: none;
}
/* 失控。背後一直冒出擊殺，越冒越快，畫面會抖、會閃紅 */
html, body {
  overflow: hidden;
}
#screen {
  z-index: 1;
}
#flood {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}
#flood span {
  position: absolute;
  white-space: nowrap;
  font-family: Consolas, "Courier New", monospace;
  line-height: 1;
  animation: surge 0.35s ease-out;
}
@keyframes surge {
  from { transform: scale(2.4); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
body.quake #screen,
body.quake #flood {
  animation: quake 0.08s steps(2) infinite;
}
@keyframes quake {
  0% { transform: translate(0, 0); }
  25% { transform: translate(-9px, 4px); }
  50% { transform: translate(7px, -6px); }
  75% { transform: translate(-4px, -8px); }
  100% { transform: translate(8px, 5px); }
}
body.red {
  background: #3a0000;
}
body.red,
body.red a {
  color: #ff2020;
  text-shadow: 3px 0 #00ffff, -3px 0 #ff0000;
}
body.flip {
  filter: invert(1);
}
.cursor {
  color: #ff0000;
  animation: blink 0.18s steps(1) infinite;
}
</style>
</head>
<body>
<div id="flood"></div>
<div id="screen">
<p>擊殺.擊殺擊殺擊殺擊殺擊殺擊殺</p>
<div id="log"></div>
<form id="line" action="result.html" method="get" target="_blank">
<input type="hidden" name="db" value="d">
<div class="row">
<span class="prompt">&gt; </span>
<span class="type">
<span id="typed"></span><span class="cursor">_</span>
<input type="text" id="q" name="q" autocomplete="off" spellcheck="false" autofocus>
</span>
</div>
</form>
</div>
<script src="d-search-db.js?v=7"></script>
<script>
var storeKey = "D.kill";
var log = [];

function esc(text) {
  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function loadLog() {
  try {
    var saved = JSON.parse(localStorage.getItem(storeKey));
    if (saved && saved.length) log = saved;
  } catch (e) {}
}

function saveLog() {
  localStorage.setItem(storeKey, JSON.stringify(log));
}

function findHits(q) {
  var found = [];
  var i, n;
  if (typeof dSearchDb === "undefined") return found;
  for (i = 0; i < dSearchDb.length; i++) {
    var keys = dSearchDb[i].keys;
    for (n = 0; n < keys.length; n++) {
      if (keys[n] === q) {
        found.push(dSearchDb[i]);
        break;
      }
    }
  }
  return found;
}

function render() {
  var html = "";
  var i, n, hits;
  for (i = 0; i < log.length; i++) {
    html += "<p>&gt; " + esc(log[i].q) + "</p>";
    hits = log[i].hits;
    if (!hits.length) {
      html += "<p>擊殺擊殺擊殺擊殺擊殺</p>";
    } else {
      html += "<p>擊殺擊殺擊殺 ";
      for (n = 0; n < hits.length; n++) {
        html += "<a href=\"" + esc(hits[n].page) + "\" target=\"_blank\">" + esc(hits[n].title) + "</a>";
      }
      html += "</p>";
    }
  }
  document.getElementById("log").innerHTML = html;
  var screen = document.getElementById("screen");
  screen.scrollTop = screen.scrollHeight;
}

function ask(raw) {
  var q = String(raw).replace(/\s/g, "");
  if (!q) return;
  if (q === "擊殺") {
    location.assign("endingHD.html");
    return;
  }
  var hits = findHits(q);
  var kept = [];
  var i;
  for (i = 0; i < hits.length; i++) {
    kept.push({ title: hits[i].title, page: hits[i].page });
  }
  log.push({ q: q, hits: kept });
  saveLog();
  render();
}

var qInput = document.getElementById("q");

function showTyped() {
  document.getElementById("typed").textContent = qInput.value;
}

qInput.addEventListener("input", showTyped);

document.getElementById("line").onsubmit = function () {
  ask(qInput.value);
  qInput.value = "";
  showTyped();
  return false;
};

document.getElementById("screen").onclick = function (event) {
  if (event.target.tagName === "A" || event.target.tagName === "INPUT") return;
  qInput.focus();
};

loadLog();
render();

document.addEventListener("click", function (e) {
  var el = e.target;
  var text;
  if (!el || el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.tagName === "A") return;
  text = el.textContent || "";
  if (text.indexOf("擊殺") === -1) return;
  if (/[A-Za-z0-9\u4e00-\u9fff]/.test(text.replace(/擊殺/g, ""))) return;
  location.assign("endingHD.html");
});

/* 打進去的字，畫面上都變成擊殺。實際的值不變，打擊殺照樣有效 */
qInput.removeEventListener("input", showTyped);
qInput.addEventListener("input", function () {
  var at = 0;
  document.getElementById("typed").textContent = qInput.value.replace(/[^\s]/g, function () {
    return at++ % 2 ? "殺" : "擊";
  });
});

var flood = document.getElementById("flood");
var floodGap = 900;
var floodMax = 500;

function spawnKill() {
  var span = document.createElement("span");
  var reps = 1 + Math.floor(Math.random() * 6);
  var text = "";
  var n;
  for (n = 0; n < reps; n++) text += "擊殺";
  span.textContent = text;
  span.style.left = (Math.random() * 100 - 10) + "%";
  span.style.top = (Math.random() * 100) + "%";
  span.style.fontSize = (12 + Math.floor(Math.random() * Math.min(160, 20 + (900 - floodGap) / 3))) + "px";
  span.style.color = Math.random() < 0.55 ? "#ff0000" : "#33ff33";
  span.style.opacity = 0.35 + Math.random() * 0.65;
  span.style.transform = "rotate(" + Math.floor(Math.random() * 50 - 25) + "deg)";
  flood.appendChild(span);
  while (flood.childNodes.length > floodMax) flood.removeChild(flood.firstChild);
  floodGap = Math.max(25, floodGap * 0.93);
  setTimeout(spawnKill, floodGap);
}

function fit(cls, ms) {
  document.body.classList.add(cls);
  setTimeout(function () {
    document.body.classList.remove(cls);
  }, ms);
}

function seizure() {
  var r = Math.random();
  if (r < 0.5) fit("quake", 180 + Math.random() * 500);
  else if (r < 0.8) fit("red", 120 + Math.random() * 400);
  else fit("flip", 60 + Math.random() * 90);
  setTimeout(seizure, 400 + Math.random() * Math.max(300, floodGap * 3));
}

setTimeout(spawnKill, 600);
setTimeout(seizure, 1500);
</script>
<script src="kill-marks.js"></script>
</body>
</html>
