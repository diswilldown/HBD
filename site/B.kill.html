<!-- B.kill。鬧鐘打 B.search 進來。樣子跟 B.search 一樣，字都變成擊殺。只有輸入擊殺才進真結局 -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>B.kill</title>
<style>
html, body {
  height: 100%;
  margin: 0;
  background: #c0c0c0;
  overflow: hidden;
}
body {
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Times New Roman", Times, serif;
  color: #000000;
}
/* 滑鼠換成鬧鐘。熱點在圓面中間 */
html, body, body * {
  cursor: url("素材/cursor-clock.png") 49 39, auto !important;
}
#page {
  width: 640px;
}
#banner {
  height: 150px;
  background: #ffffff;
  border: 1px solid #000000;
  border-radius: 16px 16px 0 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 44px;
  letter-spacing: 2px;
}
#nav {
  display: flex;
  align-items: center;
  justify-content: center;
  background: #d4d0c8;
  border: 1px solid #000000;
  border-top: none;
  border-radius: 0 0 16px 16px;
  padding: 14px 12px;
}
#search {
  margin: 0;
}
#q {
  font-family: "Times New Roman", Times, serif;
  font-size: 16px;
}
#miss {
  display: block;
  min-height: 1.2em;
  margin-top: 6px;
  text-align: center;
  color: #ff0000;
}
</style>
</head>
<body bgcolor="#c0c0c0" text="#000000">
<div id="page">
<div id="banner">擊殺.擊殺擊殺</div>
<div id="nav">
<form id="search">
<input type="text" id="q" size="28" autocomplete="off" spellcheck="false" lang="zh-Hant" autofocus>
<input type="submit" value="擊殺">
<span id="miss"></span>
</form>
</div>
</div>
<script>
document.getElementById("search").addEventListener("submit", function (e) {
  var q = document.getElementById("q").value.replace(/\s/g, "");
  var miss = document.getElementById("miss");
  e.preventDefault();
  if (q === "擊殺") {
    location.assign("endingB.html");
    return;
  }
  miss.textContent = "";
  setTimeout(function () {
    miss.textContent = "擊殺擊殺擊殺擊殺";
  }, 120);
});
</script>
<script src="kill-marks.js"></script>
</body>
</html>
