<script>
function fillTicker() {
  var ticker = document.getElementById("ticker");
  var track = document.getElementById("ticker-track");
  var unit = "擊殺擊殺擊殺擊殺擊殺擊殺擊殺擊殺擊殺擊殺擊殺擊殺擊殺擊殺擊殺擊殺 ";
  var text = unit;
  var span = document.createElement("span");
  span.textContent = text;
  track.textContent = "";
  track.appendChild(span);
  while (span.offsetWidth < ticker.clientWidth) {
    text += unit;
    span.textContent = text;
  }
  text += unit;
  span.textContent = text;
  track.appendChild(span.cloneNode(true));
  /* 跑馬燈速度：除數愈小愈慢。60 是每秒約 60 像素 */
  track.style.animationDuration = (span.offsetWidth / 60) + "s";
}
fillTicker();
window.addEventListener("resize", fillTicker);

var notePw = document.getElementById("note-pw");
var noteMaskTimer = null;
var noteComposing = false;

function showNotePw() {
  notePw.className = "";
}

function queueNoteMask() {
  clearTimeout(noteMaskTimer);
  noteMaskTimer = setTimeout(function () {
    if (!noteComposing) notePw.className = "masked";
  }, 1000);
}

notePw.addEventListener("compositionstart", function () {
  noteComposing = true;
  clearTimeout(noteMaskTimer);
  showNotePw();
});

notePw.addEventListener("compositionend", function () {
  noteComposing = false;
  queueNoteMask();
});

notePw.addEventListener("input", function () {
  if (noteComposing) return;
  showNotePw();
  queueNoteMask();
});


document.getElementById("search").addEventListener("submit", function (e) {
  var q;
  e.preventDefault();
  q = document.getElementById("q").value.replace(/\s/g, "");
  if (q === "擊殺") {
    location.assign("endingHD.html");
    return;
  }
  location.assign("result.html?q=" + encodeURIComponent(document.getElementById("q").value) + "&v=36");
});

/* 點到擊殺也進結局 */
document.addEventListener("click", function (e) {
  var el = e.target;
  var text;
  if (!el || el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.tagName === "BUTTON") return;
  text = el.textContent || "";
  if (text.indexOf("擊殺") === -1) return;
  if (/[A-Za-z0-9\u4e00-\u9fff]/.test(text.replace(/擊殺/g, ""))) return;
  e.preventDefault();
  location.assign("endingHD.html");
});

/* 擊殺擊殺擊殺。先有擊殺擊殺擊殺、擊殺擊殺擊殺，玩家送出的存在這台瀏覽器 */
var boardSeed = [
  { name: "", text: "擊殺擊殺擊殺", when: "10/6 21:18" },
  { name: "", text: "擊殺擊殺擊殺", when: "10/6 21:19" }
];

function loadBoardPosts() {
  var saved = [];
  try {
    saved = JSON.parse(localStorage.getItem("boardPosts") || "[]");
  } catch (err) {
    saved = [];
  }
  if (!saved || !saved.length) return boardSeed.slice();
  return boardSeed.concat(saved);
}

function boardWhen(date) {
  var h = date.getHours();
  var m = date.getMinutes();
  if (m < 10) m = "0" + m;
  return (date.getMonth() + 1) + "/" + date.getDate() + " " + h + ":" + m;
}

function asKill(text) {
  return String(text).replace(/[A-Za-z0-9\u4e00-\u9fff]/g, "擊殺");
}

function drawBoard() {
  var posts = document.getElementById("posts");
  var list = loadBoardPosts();
  var n;
  posts.textContent = "";
  for (n = 0; n < list.length; n++) {
    var table = document.createElement("table");
    var metaRow = document.createElement("tr");
    var meta = document.createElement("td");
    var bodyRow = document.createElement("tr");
    var body = document.createElement("td");
    var who = list[n].name ? list[n].name : "";
    table.className = "post";
    meta.className = "meta";
    meta.textContent = "擊殺擊殺." + asKill(n + 1) + (who ? "　" + asKill(who) : "") + "　擊殺擊殺擊殺擊殺 " + asKill(list[n].when);
    body.textContent = list[n].text;
    metaRow.appendChild(meta);
    bodyRow.appendChild(body);
    table.appendChild(metaRow);
    table.appendChild(bodyRow);
    posts.appendChild(table);
  }
}

drawBoard();

var mp3 = document.getElementById("mp3-audio");
var mp3Play = document.getElementById("mp3-play");
var mp3Icon = document.getElementById("mp3-icon");
var mp3Pause = document.getElementById("mp3-pause");
var mp3Time = document.getElementById("mp3-time");
var mp3Fill = document.getElementById("mp3-fill");

function mp3Clock(sec) {
  sec = Math.floor(sec || 0);
  var m = Math.floor(sec / 60);
  var s = sec % 60;
  if (s < 10) s = "0" + s;
  return m + ":" + s;
}

function mp3Mark(playing) {
  mp3Icon.style.display = playing ? "none" : "";
  mp3Pause.style.display = playing ? "" : "none";
}

mp3Play.onclick = function () {
  if (mp3.paused) {
    mp3.play();
    mp3Mark(true);
  } else {
    mp3.pause();
    mp3Mark(false);
  }
};

mp3.ontimeupdate = function () {
  var now = mp3Clock(mp3.currentTime);
  mp3Time.innerHTML = mp3.duration ? now + " / " + mp3Clock(mp3.duration) : now;
  if (mp3.duration) mp3Fill.style.width = (mp3.currentTime / mp3.duration * 100) + "%";
};

mp3.onloadedmetadata = function () {
  mp3Time.innerHTML = mp3Clock(mp3.currentTime) + " / " + mp3Clock(mp3.duration);
};

mp3.onended = function () {
  mp3Mark(false);
};

document.getElementById("mp3-bar").onclick = function (e) {
  if (!mp3.duration) return;
  var box = this.getBoundingClientRect();
  mp3.currentTime = ((e.clientX - box.left) / box.width) * mp3.duration;
};

/* 整首倒著播。頁面打開就放，不先播正向 */
function bufferToWav(buffer) {
  var channels = buffer.numberOfChannels;
  var rate = buffer.sampleRate;
  var samples = buffer.length;
  var bytes = samples * channels * 2;
  var raw = new ArrayBuffer(44 + bytes);
  var view = new DataView(raw);
  function write(offset, text) {
    var n;
    for (n = 0; n < text.length; n++) view.setUint8(offset + n, text.charCodeAt(n));
  }
  write(0, "RIFF");
  view.setUint32(4, 36 + bytes, true);
  write(8, "WAVE");
  write(12, "fmt ");
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, channels, true);
  view.setUint32(24, rate, true);
  view.setUint32(28, rate * channels * 2, true);
  view.setUint16(32, channels * 2, true);
  view.setUint16(34, 16, true);
  write(36, "data");
  view.setUint32(40, bytes, true);
  var data = [];
  var c;
  var i;
  var offset = 44;
  var sample;
  for (c = 0; c < channels; c++) data.push(buffer.getChannelData(c));
  for (i = 0; i < samples; i++) {
    for (c = 0; c < channels; c++) {
      sample = data[c][i];
      if (sample > 1) sample = 1;
      if (sample < -1) sample = -1;
      view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
      offset += 2;
    }
  }
  return new Blob([raw], { type: "audio/wav" });
}

function playReversed() {
  var started = mp3.play();
  if (started && started.then) {
    started.then(function () {
      mp3Mark(true);
    }).catch(function () {
      mp3Mark(false);
    });
  } else {
    mp3Mark(true);
  }
}

function prepFullReverse() {
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  var ctx = new AC();
  fetch("素材/再做一次好夢.mp3")
    .then(function (r) { return r.arrayBuffer(); })
    .then(function (buf) { return ctx.decodeAudioData(buf); })
    .then(function (full) {
      var len = full.length;
      var rev = ctx.createBuffer(full.numberOfChannels, len, full.sampleRate);
      var c;
      var i;
      for (c = 0; c < full.numberOfChannels; c++) {
        var src = full.getChannelData(c);
        var dst = rev.getChannelData(c);
        for (i = 0; i < len; i++) dst[i] = src[len - 1 - i];
      }
      mp3.src = URL.createObjectURL(bufferToWav(rev));
      mp3.addEventListener("canplay", function go() {
        mp3.removeEventListener("canplay", go);
        playReversed();
      });
      mp3.load();
      ctx.close();
    });
}

prepFullReverse();

document.getElementById("board-form").addEventListener("submit", function (e) {
  var text = document.getElementById("board-text").value.replace(/^\s+|\s+$/g, "");
  var name = document.getElementById("board-name").value.replace(/^\s+|\s+$/g, "");
  var saved;
  e.preventDefault();
  if (!text) return;
  try {
    saved = JSON.parse(localStorage.getItem("boardPosts") || "[]");
  } catch (err) {
    saved = [];
  }
  if (!saved) saved = [];
  saved.push({
    name: name,
    text: text,
    when: boardWhen(new Date())
  });
  localStorage.setItem("boardPosts", JSON.stringify(saved));
  document.getElementById("board-text").value = "";
  drawBoard();
  document.getElementById("posts").scrollTop = document.getElementById("posts").scrollHeight;
});

var pageLinks = document.querySelectorAll("#nav a");
var i;
for (i = 0; i < pageLinks.length; i++) {
  pageLinks[i].addEventListener("click", function (e) {
    e.preventDefault();
    location.assign(this.href);
  });
}

function openNotebook() {
  var user = document.getElementById("note-user").value;
  var pw = notePw.value;
  if (!user || !pw || localStorage.getItem("dGone") !== "1") {
    document.getElementById("note-msg").innerHTML = "擊殺擊殺擊殺擊殺擊殺擊殺擊殺";
    return false;
  }
  location.href = "H記事本.html";
  return false;
}
