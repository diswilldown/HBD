<!-- B.search。B 自己的大腦。她失憶了，搜什麼都是搜尋錯誤 -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>B.search</title>
<style>
html, body {
  height: 100%;
  margin: 0;
  background: #c0c0c0;
}
body {
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Times New Roman", Times, serif;
  color: #000000;
}
#page {
  width: 640px;
}
#banner {
  height: 150px;
  background: #ffffff;
  border: 1px solid #000000;
  border-radius: 16px 16px 0 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 44px;
  letter-spacing: 2px;
}
#nav {
  display: flex;
  align-items: center;
  justify-content: center;
  background: #d4d0c8;
  border: 1px solid #000000;
  border-top: none;
  border-radius: 0 0 16px 16px;
  padding: 14px 12px;
}
#search {
  margin: 0;
}
#q {
  font-family: "Times New Roman", Times, serif;
  font-size: 16px;
}
#miss {
  display: block;
  min-height: 1.2em;
  margin-top: 6px;
  text-align: center;
  color: #ff0000;
}
</style>
</head>
<body bgcolor="#c0c0c0" text="#000000">
<div id="page">
<div id="banner">B.search</div>
<div id="nav">
<form id="search">
<input type="text" id="q" size="28" autocomplete="off" spellcheck="false" lang="zh-Hant" autofocus>
<input type="submit" value="搜尋">
<span id="miss"></span>
</form>
</div>
</div>
<script>
document.getElementById("search").addEventListener("submit", function (e) {
  e.preventDefault();
  var miss = document.getElementById("miss");
  miss.textContent = "";
  setTimeout(function () {
    miss.textContent = "搜尋錯誤";
  }, 120);
});
</script>
</body>
</html>
