<!-- endingHD。假結局。H 的大腦斷線：雜訊收成一條線、一個點，然後全白。H.search 和 D.search 同時斷線，她才知道兩個是同一顆大腦。之後放 H 預錄的話 -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>endingHD</title>
<style>
html, body {
  height: 100%;
  margin: 0;
  background: #ffffff;
  overflow: hidden;
}
body {
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Microsoft JhengHei", "PingFang TC", "Heiti TC", "Noto Sans TC", sans-serif;
}

/* 斷線畫面。蓋在白頁上，雜訊閃一下就收掉 */
#tv {
  position: fixed;
  inset: 0;
  z-index: 10;
  background: #000000;
}
#noise {
  position: absolute;
  inset: 0;
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,0.10) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 5px);
  animation: jitter 0.09s steps(2) infinite;
}
@keyframes jitter {
  0%   { transform: translate(0, 0); }
  50%  { transform: translate(-3px, 2px); }
  100% { transform: translate(2px, -2px); }
}
#tv .mark {
  position: absolute;
  color: #ff0000;
  font-family: Consolas, "Courier New", monospace;
  font-weight: bold;
  animation: flick 0.12s steps(2) infinite;
}
@keyframes flick {
  50% { opacity: 0.25; }
}
/* 收成一條白線，再縮成一個點 */
#beam {
  position: absolute;
  left: 0;
  top: 50%;
  width: 100%;
  height: 100%;
  background: #ffffff;
  transform: translateY(-50%) scaleY(0);
  opacity: 0;
}
#tv.off #noise,
#tv.off .mark {
  display: none;
}
#tv.off #beam {
  opacity: 1;
  animation: collapse 0.9s ease-in forwards;
}
@keyframes collapse {
  0%   { transform: translateY(-50%) scale(1, 1); }
  35%  { transform: translateY(-50%) scale(1, 0.004); }
  75%  { transform: translateY(-50%) scale(0.002, 0.004); }
  100% { transform: translateY(-50%) scale(0, 0); }
}
#tv.gone {
  transition: opacity 1.2s ease;
  opacity: 0;
  pointer-events: none;
}

/* 斷線之後的小字。兩個站同時斷，她只打了其中一個 */
#status {
  position: fixed;
  left: 0;
  right: 0;
  top: 50%;
  margin: 0;
  transform: translateY(-50%);
  text-align: center;
  font-size: 15px;
  line-height: 2.2;
  letter-spacing: 0.3em;
  color: #9a9a9a;
  opacity: 0;
  transition: opacity 1.4s ease;
}
#status span {
  display: inline-block;
  width: 7em;
  text-align: left;
  letter-spacing: 0.08em;
}
#status.show {
  opacity: 1;
}

/* H 的錄音字幕 */
#line {
  margin: 0;
  max-width: 16em;
  text-align: center;
  font-size: 34px;
  font-weight: 300;
  letter-spacing: 0.08em;
  line-height: 2;
  color: #1a1a1a;
  white-space: pre-wrap;
}
#line .ch {
  opacity: 0;
  animation: ink 0.6s ease forwards;
}
@keyframes ink {
  from { opacity: 0; filter: blur(3px); }
  to   { opacity: 1; filter: blur(0); }
}
</style>
</head>
<body>
<div id="tv"><div id="noise"></div><div id="beam"></div></div>
<p id="status"><span>H.search</span>連線中斷<br><span>D.search</span>連線中斷</p>
<p id="line"></p>

<!-- H 的錄音，跟著字幕一起播 -->
<audio id="voice" src="素材/H錄音.wav" preload="auto"></audio>

<script>
var tv = document.getElementById("tv");
var statusLine = document.getElementById("status");
var line = document.getElementById("line");
var voice = document.getElementById("voice");

/* 錄音的字幕。一行一句 */
var words = "謝謝你不選擇殺我\n但能拯救自己的只有你";

/* 節奏。單位是毫秒 */
var NOISE_TIME = 1100;
var SILENCE_TIME = 2600;
var STATUS_TIME = 4200;
var CHAR_TIME = 190;
var LINE_GAP = 900;

function sprinkleMarks() {
  var i;
  var m;
  for (i = 0; i < 14; i += 1) {
    m = document.createElement("span");
    m.className = "mark";
    m.textContent = "(*)";
    m.style.left = Math.random() * 92 + "%";
    m.style.top = Math.random() * 92 + "%";
    m.style.fontSize = 14 + Math.random() * 90 + "px";
    m.style.transform = "rotate(" + (Math.random() * 60 - 30) + "deg)";
    m.style.animationDelay = Math.random() * 0.12 + "s";
    tv.appendChild(m);
  }
}

function playVoice() {
  var p;
  try {
    p = voice.play();
    if (p && p.catch) {
      p.catch(function () {
        document.addEventListener("click", function once() {
          document.removeEventListener("click", once);
          voice.play().catch(function () {});
        });
      });
    }
  } catch (e) {}
}

function typeWords() {
  var at = 0;
  function next() {
    var c;
    var span;
    if (at >= words.length) return;
    c = words.charAt(at);
    at += 1;
    if (c === "\n") {
      line.appendChild(document.createTextNode("\n"));
      setTimeout(next, LINE_GAP);
      return;
    }
    span = document.createElement("span");
    span.className = "ch";
    span.textContent = c;
    line.appendChild(span);
    setTimeout(next, CHAR_TIME);
  }
  next();
}

sprinkleMarks();

setTimeout(function () {
  tv.className = "off";
}, NOISE_TIME);

setTimeout(function () {
  tv.className = "off gone";
}, NOISE_TIME + 900);

setTimeout(function () {
  statusLine.className = "show";
}, NOISE_TIME + 900 + SILENCE_TIME);

setTimeout(function () {
  statusLine.className = "";
}, NOISE_TIME + 900 + SILENCE_TIME + STATUS_TIME);

setTimeout(function () {
  playVoice();
  typeWords();
}, NOISE_TIME + 900 + SILENCE_TIME + STATUS_TIME + 1600);
</script>
</body>
</html>
