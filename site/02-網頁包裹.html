<!-- 2 網頁包裹 -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<base target="_blank">
<title>網頁包裹</title>
<style>
html, body {
  height: 100%;
  margin: 0;
}
body {
  display: flex;
  align-items: center;
  justify-content: center;
  background: #c0c0c0;
  font-family: "Times New Roman", Times, serif;
}
#pack {
  text-align: center;
}
#lock {
  margin-top: 28px;
  display: flex;
  justify-content: center;
  gap: 14px;
}
.wheel {
  width: 72px;
  background: #1c1c1c;
  border: 3px solid #111111;
  border-radius: 8px;
  padding: 6px 0 8px;
}
.wheel button {
  display: block;
  width: 100%;
  background: transparent;
  border: none;
  color: #e6e6e6;
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
  padding: 6px 0;
}
.wheel button:active {
  color: #ffffff;
}
#lock.shake {
  animation: shake 0.4s ease-in-out;
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-10px); }
  40% { transform: translateX(9px); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(4px); }
}
.num {
  color: #f3e2b8;
  font-family: "Courier New", Courier, monospace;
  font-size: 40px;
  line-height: 1.1;
}
</style>
</head>
<body bgcolor="#c0c0c0" text="#000000">
<div id="pack">
<svg width="240" height="190" viewBox="0 0 240 190" aria-label="包裹">
<polygon points="40,58 120,28 200,58" fill="#d7bc96" stroke="#6a4b28" stroke-width="3"/>
<rect x="40" y="58" width="160" height="112" fill="#c4a574" stroke="#6a4b28" stroke-width="3"/>
<line x1="120" y1="28" x2="120" y2="170" stroke="#7a3030" stroke-width="4"/>
<line x1="40" y1="112" x2="200" y2="112" stroke="#7a3030" stroke-width="4"/>
<circle cx="120" cy="112" r="7" fill="#5c2424" stroke="#3d1616" stroke-width="2"/>
</svg>
<div id="lock">
<div class="wheel">
<button type="button" class="up" aria-label="上">▲</button>
<div class="num">0</div>
<button type="button" class="down" aria-label="下">▼</button>
</div>
<div class="wheel">
<button type="button" class="up" aria-label="上">▲</button>
<div class="num">0</div>
<button type="button" class="down" aria-label="下">▼</button>
</div>
<div class="wheel">
<button type="button" class="up" aria-label="上">▲</button>
<div class="num">0</div>
<button type="button" class="down" aria-label="下">▼</button>
</div>
<div class="wheel">
<button type="button" class="up" aria-label="上">▲</button>
<div class="num">0</div>
<button type="button" class="down" aria-label="下">▼</button>
</div>
</div>
</div>
<script>
/* 停手一秒還沒打開，鎖就抖一下 */
var lock = document.getElementById("lock");
var shakeTimer = null;

function shakeLock() {
  lock.className = "";
  void lock.offsetWidth;
  lock.className = "shake";
}

var wheels = document.querySelectorAll(".wheel");
for (var i = 0; i < wheels.length; i++) {
  (function (wheel) {
    var num = wheel.querySelector(".num");
    function setDigit(next) {
      num.textContent = String((next + 10) % 10);
      var nums = document.querySelectorAll(".num");
      var code = "";
      for (var n = 0; n < nums.length; n++) code += nums[n].textContent;
      clearTimeout(shakeTimer);
      if (code === "0426" && localStorage.getItem("noteOpen") === "1") {
        window.open("cl(＊)ck.html", "_blank");
        return;
      }
      shakeTimer = setTimeout(shakeLock, 1000);
    }
    wheel.querySelector(".up").onclick = function () {
      setDigit(Number(num.textContent) + 1);
    };
    wheel.querySelector(".down").onclick = function () {
      setDigit(Number(num.textContent) - 1);
    };
  })(wheels[i]);
}
</script>
</body>
</html>
