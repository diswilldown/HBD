<script>
function fillTicker() {
  var ticker = document.getElementById("ticker");
  var track = document.getElementById("ticker-track");
  var unit = "如果有期待 我想最好是不說 你總是微笑的 你總是不開口 世界被你掌握 月亮繞地球 地球繞著太陽走 我以為世界是座寧靜的宇宙 今晚的天空有一顆流星劃過 在預言著什麼 在無聲之中你拉起了我的手 我怎麼感覺整個黑夜在震動 耳朵裡我聽到了心跳的節奏 星星在閃爍 你怎麼說 你心中一定有座濃霧的湖泊 任憑月光再皎潔 照也照不透 你眼中閃爍湖面 無邊的溫柔 那波光在誘惑 在無聲之中你拉起了我的手 我怎麼感覺整個黑夜在震動 耳朵裡我聽到了心跳的節奏 星星在閃爍 你會怎麼說 我恨P 如果沒有P就好了 我多想要你回來 我錯了 我辜負了你的期待 ";
  var text = unit;
  var span = document.createElement("span");
  span.textContent = text;
  track.textContent = "";
  track.appendChild(span);
  while (span.offsetWidth < ticker.clientWidth) {
    text += unit;
    span.textContent = text;
  }
  text += unit;
  span.textContent = text;
  track.appendChild(span.cloneNode(true));
  /* 跑馬燈速度：除數愈小愈慢。60 是每秒約 60 像素 */
  track.style.animationDuration = (span.offsetWidth / 60) + "s";
}
fillTicker();
window.addEventListener("resize", fillTicker);

var notePw = document.getElementById("note-pw");
var noteMaskTimer = null;
var noteComposing = false;

function showNotePw() {
  notePw.className = "";
}

function queueNoteMask() {
  clearTimeout(noteMaskTimer);
  noteMaskTimer = setTimeout(function () {
    if (!noteComposing) notePw.className = "masked";
  }, 1000);
}

notePw.addEventListener("compositionstart", function () {
  noteComposing = true;
  clearTimeout(noteMaskTimer);
  showNotePw();
});

notePw.addEventListener("compositionend", function () {
  noteComposing = false;
  queueNoteMask();
});

notePw.addEventListener("input", function () {
  if (noteComposing) return;
  showNotePw();
  queueNoteMask();
});

var catbox = document.getElementById("catbox");
var cat = document.getElementById("cat");
var meow = document.getElementById("meow");
var lp = document.getElementById("lp");
var rp = document.getElementById("rp");
var catX = 0;
var catTarget = 0;
var catReady = false;
var catTalking = false;
var catLineAt = 0;
/* 固定詞庫。一句一行，提示自己寫。 */
var catLines = [
  "我知道一些事情畢竟這是H的大腦",
  "H不知道我在這",
  "組織案件編碼通常是英文代號配當天日期像EX-1010",
  "有些東西鎖起來了就去問H吧，我不小心打翻水害的",
  "新聞三頁都有線索喵",
  "你體內跟H有相同的東西"
];
var leftEye = { x: 66, y: 123 };
var rightEye = { x: 94, y: 123 };

function clampCat(n, min, max) {
  if (n < min) return min;
  if (n > max) return max;
  return n;
}

catbox.addEventListener("mousemove", function (e) {
  var box = catbox.getBoundingClientRect();
  var catRect = cat.getBoundingClientRect();
  var mx = e.clientX - box.left;
  var my = e.clientY - box.top;
  var maxX = box.width - cat.offsetWidth - 8;
  catTarget = clampCat(mx - cat.offsetWidth / 2, 8, maxX);
  var cx = catRect.left - box.left + cat.offsetWidth / 2;
  var cy = catRect.top - box.top + cat.offsetHeight * 0.58;
  var dx = mx - cx;
  var dy = my - cy;
  var dist = Math.sqrt(dx * dx + dy * dy) || 1;
  var px = (dx / dist) * 2.4;
  var py = (dy / dist) * 2.2;
  lp.setAttribute("cx", leftEye.x + px);
  lp.setAttribute("cy", leftEye.y + py);
  rp.setAttribute("cx", rightEye.x + px);
  rp.setAttribute("cy", rightEye.y + py);
  var tilt = clampCat(dx / 18, -8, 8);
  cat.style.transform = "rotate(" + tilt + "deg)";
  if (dist < 90) {
    cat.className = "pet";
    if (!catTalking && catLines.length) {
      meow.textContent = catLines[catLineAt % catLines.length];
      catLineAt = catLineAt + 1;
      catTalking = true;
    }
  } else {
    cat.className = "look";
    meow.textContent = "";
    catTalking = false;
  }
});

catbox.addEventListener("mouseleave", function () {
  var box = catbox.getBoundingClientRect();
  cat.className = "";
  meow.textContent = "";
  catTalking = false;
  lp.setAttribute("cx", leftEye.x);
  lp.setAttribute("cy", leftEye.y);
  rp.setAttribute("cx", rightEye.x);
  rp.setAttribute("cy", rightEye.y);
  cat.style.transform = "";
  catTarget = (box.width - cat.offsetWidth) / 2;
});

function moveCat() {
  var box = catbox.getBoundingClientRect();
  if (!catReady && box.width) {
    catX = (box.width - cat.offsetWidth) / 2;
    catTarget = catX;
    catReady = true;
  }
  catX += (catTarget - catX) * 0.12;
  cat.style.left = catX + "px";
  requestAnimationFrame(moveCat);
}
moveCat();

/* 留言板。先有留言一、留言二，玩家送出的存在這台瀏覽器 */
var boardSeed = [
  { name: "H", text: "Lx hdspkv fvfhur hyd", when: "10/10 00:00" }
];

function loadBoardPosts() {
  var saved = [];
  try {
    saved = JSON.parse(localStorage.getItem("boardPosts") || "[]");
  } catch (err) {
    saved = [];
  }
  if (!saved || !saved.length) return boardSeed.slice();
  return boardSeed.concat(saved);
}

function boardWhen(date) {
  var h = date.getHours();
  var m = date.getMinutes();
  if (m < 10) m = "0" + m;
  return (date.getMonth() + 1) + "/" + date.getDate() + " " + h + ":" + m;
}

function drawBoard() {
  var posts = document.getElementById("posts");
  var list = loadBoardPosts();
  var n;
  posts.textContent = "";
  for (n = 0; n < list.length; n++) {
    var table = document.createElement("table");
    var metaRow = document.createElement("tr");
    var meta = document.createElement("td");
    var bodyRow = document.createElement("tr");
    var body = document.createElement("td");
    var who = list[n].name ? list[n].name : "";
    table.className = "post";
    meta.className = "meta";
    meta.textContent = "No." + (n + 1) + (who ? "　" + who : "") + "　留言時間 " + list[n].when;
    body.textContent = list[n].text;
    metaRow.appendChild(meta);
    bodyRow.appendChild(body);
    table.appendChild(metaRow);
    table.appendChild(bodyRow);
    posts.appendChild(table);
  }
}

drawBoard();

var mp3 = document.getElementById("mp3-audio");
var mp3Play = document.getElementById("mp3-play");
var mp3Icon = document.getElementById("mp3-icon");
var mp3Pause = document.getElementById("mp3-pause");
var mp3Time = document.getElementById("mp3-time");
var mp3Fill = document.getElementById("mp3-fill");

function mp3Clock(sec) {
  sec = Math.floor(sec || 0);
  var m = Math.floor(sec / 60);
  var s = sec % 60;
  if (s < 10) s = "0" + s;
  return m + ":" + s;
}

function mp3Mark(playing) {
  mp3Icon.style.display = playing ? "none" : "";
  mp3Pause.style.display = playing ? "" : "none";
}

mp3Play.onclick = function () {
  if (mp3.paused) {
    mp3.play();
    mp3Mark(true);
  } else {
    mp3.pause();
    mp3Mark(false);
  }
};

mp3.ontimeupdate = function () {
  var now = mp3Clock(mp3.currentTime);
  mp3Time.innerHTML = mp3.duration ? now + " / " + mp3Clock(mp3.duration) : now;
  if (mp3.duration) mp3Fill.style.width = (mp3.currentTime / mp3.duration * 100) + "%";
};

mp3.onloadedmetadata = function () {
  mp3Time.innerHTML = mp3Clock(mp3.currentTime) + " / " + mp3Clock(mp3.duration);
};

mp3.onended = function () {
  mp3Mark(false);
};

document.getElementById("mp3-bar").onclick = function (e) {
  if (!mp3.duration) return;
  var box = this.getBoundingClientRect();
  mp3.currentTime = ((e.clientX - box.left) / box.width) * mp3.duration;
};

document.getElementById("board-form").addEventListener("submit", function (e) {
  var text = document.getElementById("board-text").value.replace(/^\s+|\s+$/g, "");
  var name = document.getElementById("board-name").value.replace(/^\s+|\s+$/g, "");
  var saved;
  e.preventDefault();
  if (!text) return;
  try {
    saved = JSON.parse(localStorage.getItem("boardPosts") || "[]");
  } catch (err) {
    saved = [];
  }
  if (!saved) saved = [];
  saved.push({
    name: name,
    text: text,
    when: boardWhen(new Date())
  });
  localStorage.setItem("boardPosts", JSON.stringify(saved));
  document.getElementById("board-text").value = "";
  drawBoard();
  document.getElementById("posts").scrollTop = document.getElementById("posts").scrollHeight;
});

var pageLinks = document.querySelectorAll("#nav a");
var i;
for (i = 0; i < pageLinks.length; i++) {
  pageLinks[i].addEventListener("click", function (e) {
    e.preventDefault();
    window.open(this.href, "_blank");
  });
}

function openNotebook() {
  var user = document.getElementById("note-user").value;
  var pw = notePw.value;
  if (user !== "H" || pw !== "spilledwater") {
    document.getElementById("note-msg").innerHTML = "帳號或密碼錯誤";
    return false;
  }
  localStorage.setItem("noteOpen", "1");
  window.open("H記事本.html", "_blank");
  return false;
}
</script>
