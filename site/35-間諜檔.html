<p class="sec">&gt; B 是我的人。</p>
<p>她進組織的時候，就已經是了。</p>
<p>她給我的東西，比組織給她的薪水值錢得多。</p>

<p class="sec">&gt; 她送出來的</p>
<table class="log">
<tr><td>倉庫的出貨單</td><td>帳上有，貨架上沒有</td></tr>

<p class="sec">&gt; 09/13 之後，她再也沒有回報。</p>
<p>組織說她死了。我不信。</p>
<p>如果她還活著，她不會記得我。也不會記得自己替誰做事。</p>
