<script>
/* 那句話一個字一個字打出來 */
var line = document.getElementById("line");
var text = line.textContent;
var i = 0;
line.textContent = "";
function typeLine() {
  i = i + 1;
  line.textContent = text.slice(0, i);
  if (i < text.length) setTimeout(typeLine, 220);
}
typeLine();
</script>
