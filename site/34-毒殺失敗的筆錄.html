<p class="dim">&gt; 筆錄　09/02　醫務室　錄音轉文字</p>
<p class="dim">&gt; 受詢人：B　詢問人：<span class="cut">　　　</span></p>

<p class="sec">問：你記得昏倒前在做什麼？</p>
<p>答：在查一筆貨。帳上寫的是醫療耗材，倉庫裡沒有。</p>

<p class="sec">問：這件事你跟誰說過？</p>
<p>答：只跟我的負責人。H。</p>

<p class="sec">問：之後呢？</p>
<p>答：他說辛苦了，叫我早點下班。桌上有一杯咖啡，我以為是他順手買的。</p>

<p class="sec">問：你喝了？</p>
<p>答：喝了一半。後來的事我不記得。</p>

<p class="sec">問：你覺得是誰放的？</p>
<p>答：……</p>
<p class="dim">（受詢人沉默約四十秒）</p>
<p>答：我不想回答這題。</p>

<p class="sec dim">&gt; 檢驗結果：</p>
<p class="dim">&gt; 咖啡杯在送驗前被清洗過。</p>
<p class="warn">&gt; 本案未立案。承辦人：H</p>
