<!DOCTYPE html>

<style>
html, body {
  margin: 0;
  background: #c0c0c0;
}
body {
  font-family: "Times New Roman", Times, serif;
  font-size: 14px;
  color: #000000;
}
#paper {
  width: 720px;
  margin: 24px auto;
  background: #ffffff;
  border: 1px solid #000000;
  padding: 20px 24px 16px;
}
h2 {
  margin: 0 0 6px;
  font-size: 18px;
  font-weight: bold;
  text-align: left;
}
hr {
  border: 0;
  border-top: 1px solid #000000;
  margin: 0;
}
.item {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding: 12px 0;
  border-bottom: 1px solid #cccccc;
  text-align: left;
}
.copy {
  flex: 1;
}
.title {
  display: block;
  font-size: 15px;
  font-weight: bold;
  line-height: 1.35;
  color: #0000ff;
  text-decoration: underline;
}
a.title:link {
  color: #0000ff;
  text-decoration: underline;
}
a.title:visited {
  color: #ff0000;
  text-decoration: underline;
}
.date {
  margin: 2px 0 0;
  font-size: 12px;
  line-height: 1.2;
  color: #444444;
}
.lead {
  margin: 4px 0 0;
  font-size: 13px;
  line-height: 1.4;
}
.thumb {
  flex: none;
  width: 96px;
  height: 68px;
  background: #eeeeee;
  border: 1px solid #000000;
  overflow: hidden;
}
.thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
#pages {
  margin: 14px 0 0;
  text-align: left;
  font-size: 14px;
}
#pages a:link {
  color: #0000ff;
}
#pages a:visited {
  color: #ff0000;
}
#pages b {
  margin: 0 6px;
}

<body bgcolor="#c0c0c0" text="#000000" link="#0000ff" vlink="#ff0000">
<div id="paper">

<hr>
<div class="item">

<p class="lead">每個英文字母往後移固定幾格，句子就會變成另一串字。</p>
</div>

</div>

</div>

</div>
